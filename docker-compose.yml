# Sharpex: web + PostgreSQL + gateway + servicios.
#   docker compose up -d --build     (o npm run backend)
# Sólo la web (puerto 8090) se abre a la red, para entrar desde el móvil; pide usuario y contraseña. El gateway
# (127.0.0.1:47365) y, para depurar, PostgreSQL (127.0.0.1:55432) y Adminer (127.0.0.1:8080) se quedan en este equipo.
# Para cerrar la web a la red: WEB_BIND=127.0.0.1 en el .env.
# Las credenciales salen del .env de esta carpeta (no se sube a git; plantilla en .env.example).

# Los servicios de Node comparten una imagen. La construye sólo el gateway: si la construyeran todos a la vez, la primera
# vez (un servidor nuevo, o tras cambiar el nombre) Docker falla al crear la misma etiqueta desde varios sitios ("already
# exists"). Los demás la usan tal cual y no la buscan en Docker Hub
x-servicio: &servicio
  image: sharpex-server
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &entorno
    DATABASE_URL: postgres://${POSTGRES_USER:-lolet}:${POSTGRES_PASSWORD:-lolet}@db:5432/${POSTGRES_DB:-lolet}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lolet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lolet}
      POSTGRES_DB: ${POSTGRES_DB:-lolet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  bets:
    <<: *servicio
    command: ["node", "services/bets/index.js"]

  esports:
    <<: *servicio
    command: ["node", "services/esports/index.js"]

  odds:
    <<: *servicio
    command: ["node", "services/odds/index.js"]
    environment:
      <<: *entorno
      CAPTURAS_DIR: /capturas
    volumes:
      # Fotos de las páginas de las casas (captura-*.json) para ajustar los lectores
      - ./capturas:/capturas

  # Lector de cuotas: Chromium sin cabeza que lee Winamax y Betway (antes lo hacía la extensión de Chrome)
  lector:
    build: ./server/lector
    image: sharpex-lector
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:47365
      # Sólo el token (no todo el .env): el contenedor que abre páginas de terceros no necesita más secretos
      LECTOR_TOKEN: ${LECTOR_TOKEN:-}
    volumes:
      # El lector de cada casa es el mismo del marcador: se lee en cada trabajo, sin reconstruir
      - ./chrome/bookmarklet:/lector-src:ro
    shm_size: 512m
    depends_on:
      - gateway

  # Baloncesto: NBA y WNBA (ESPN), Euroliga y EuroCup (API de la Euroliga)
  basket:
    <<: *servicio
    command: ["node", "services/basket/index.js"]

  # Tenis: ATP y WTA (ESPN)
  tennis:
    <<: *servicio
    command: ["node", "services/tennis/index.js"]

  # Fútbol: LaLiga, Segunda, Premier, Serie A, Bundesliga, Ligue 1, competiciones europeas y Copa del Rey (ESPN)
  football:
    <<: *servicio
    command: ["node", "services/football/index.js"]

  # MMA: UFC y PFL (ESPN) y WOW (wowmma.com)
  mma:
    <<: *servicio
    command: ["node", "services/mma/index.js"]

  # Motor de valor de los Challenger (server/sharpex-tenis): baja el histórico (Sackmann y TennisMyLife) y reentrena cada día
  challenger:
    <<: *servicio
    command: ["node", "services/challenger/index.js"]
    environment:
      <<: *entorno
      CHALLENGER_DATA: /data
    volumes:
      # Histórico (unos 60 MB) y modelo: si se borra, se vuelve a bajar solo. El historial de picks va en PostgreSQL
      - challenger:/data

  gateway:
    <<: *servicio
    build: ./server
    pull_policy: build
    command: ["node", "services/gateway/index.js"]
    ports:
      - "127.0.0.1:47365:47365"

  # La web: http://127.0.0.1:8090 en este equipo; desde el móvil, http://<IP de este equipo>:8090
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: sharpex-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:80"
    depends_on:
      - gateway

  # Visor web de la base de datos: http://127.0.0.1:8080 (Sistema PostgreSQL, servidor db, usuario y clave del .env).
  # Sólo para depurar: no arranca con `npm run backend`, sino con `npm run backend:debug` (perfil "debug")
  adminer:
    profiles: ["debug"]
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  challenger:
