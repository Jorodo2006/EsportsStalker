# Cabeceras de seguridad. Van en un fichero aparte porque nginx no hereda los add_header del servidor en un location que
# ponga los suyos (el de /assets/ y el de index.html, por la caché): hay que incluirlas en cada uno
# http: en img-src porque lolesports da sus logos por http
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS: activar cuando la web ya se sirva por HTTPS (con un proxy con TLS delante)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
