# Cabeceras de seguridad. Van en un fichero aparte porque nginx no hereda los add_header del servidor en un location que
# ponga los suyos (el de /assets/ y el de index.html, por la caché): hay que incluirlas en cada uno
# http: en img-src porque lolesports da sus logos por http.
# Scripts con nonce y 'strict-dynamic', la forma que admite AdSense (support.google.com/adsense/answer/16283098): sólo se
# ejecutan los <script> de index.html, que llevan el nonce de esta petición ($request_id, ver nginx.conf), y lo que carguen
# ellos (el script de AdSense lo añade la app). 'unsafe-inline' y https: sólo los usan navegadores antiguos que no entienden
# nonces. Los anuncios y el aviso de cookies de Google van en marcos y piden datos a sus dominios: frame-src y connect-src https:
# worker-src 'self': el service worker de las notificaciones (public/sw.js); con 'strict-dynamic' no basta con script-src
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'nonce-$request_id' 'strict-dynamic' 'unsafe-inline' https:; font-src 'self' data:; frame-src https:; connect-src 'self' https:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS: activar cuando la web ya se sirva por HTTPS (con un proxy con TLS delante)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
