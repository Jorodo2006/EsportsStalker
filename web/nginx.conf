server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # http: en img-src porque lolesports da sus logos por http
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;

  # Con una variable, nginx vuelve a resolver el nombre: el gateway cambia de IP cada vez que se reconstruye
  resolver 127.0.0.11 valid=10s;
  set $gateway http://gateway:47365;

  # Sólo se publica lo que usa la web; /jobs y /odds, los del lector, se quedan en el gateway
  location /api/ {
    proxy_pass $gateway;
    proxy_read_timeout 190s; # las stats esperan en la cola de Leaguepedia
    client_max_body_size 20m; # importar apuestas
  }

  location = /events {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off; # los avisos tienen que llegar al momento
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
