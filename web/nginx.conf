server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/cabeceras.conf;

  # Compresión. Los ficheros de la web ya vienen comprimidos al máximo de la compilación (web/Dockerfile): gzip_static los
  # sirve sin gastar CPU. El JSON de la API se comprime al vuelo: los partidos de un equipo pasan de 276 KB a 26 KB
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # El gateway y el servicio de apuestas necesitan la IP real para los límites de intentos
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Detrás de Cloudflare Tunnel todas las visitas llegan desde el contenedor cloudflared (red de Docker):
  # la IP del cliente viene en CF-Connecting-IP. Sin esto, los límites de intentos serían comunes a todos
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # Con una variable, nginx vuelve a resolver el nombre: el gateway cambia de IP cada vez que se reconstruye
  resolver 127.0.0.11 valid=10s;
  set $gateway http://gateway:47365;

  # Sólo se publica lo que usa la web; /jobs y /odds, los del lector, se quedan en el gateway
  location /api/ {
    proxy_pass $gateway;
    proxy_read_timeout 190s; # las stats esperan en la cola de Leaguepedia
    client_max_body_size 20m; # importar apuestas
  }

  location = /events {
    proxy_pass $gateway;
    gzip off; # comprimido, nginx retendría los avisos hasta llenar un bloque
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr; # al definir una cabecera aquí, no se heredan las del servidor
    proxy_buffering off; # los avisos tienen que llegar al momento
    proxy_read_timeout 1h;
  }

  # El manifest de la app (public/manifest.webmanifest) con su tipo, para que el navegador la ofrezca instalar. Va con las cabeceras
  # de seguridad porque un location con su propio add_header no hereda las del servidor
  location = /manifest.webmanifest {
    include /etc/nginx/cabeceras.conf;
    default_type application/manifest+json;
  }

  # Los ficheros de la compilación llevan un hash en el nombre: si cambian, cambia el nombre. Se guardan un año sin preguntar
  location /assets/ {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # La página en sí se comprueba siempre (con ETag sólo viaja si ha cambiado): así, tras desplegar, se ve la versión nueva
  location = /index.html {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
