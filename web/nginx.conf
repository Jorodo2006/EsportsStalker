server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # http: en img-src porque lolesports da sus logos por http
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # HSTS: activar cuando la web ya se sirva por HTTPS (con un proxy con TLS delante)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # El gateway y el servicio de apuestas necesitan la IP real para los límites de intentos
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Con una variable, nginx vuelve a resolver el nombre: el gateway cambia de IP cada vez que se reconstruye
  resolver 127.0.0.11 valid=10s;
  set $gateway http://gateway:47365;

  # Sólo se publica lo que usa la web; /jobs y /odds, los del lector, se quedan en el gateway
  location /api/ {
    proxy_pass $gateway;
    proxy_read_timeout 190s; # las stats esperan en la cola de Leaguepedia
    client_max_body_size 20m; # importar apuestas
  }

  location = /events {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr; # al definir una cabecera aquí, no se heredan las del servidor
    proxy_buffering off; # los avisos tienen que llegar al momento
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
